# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.attachments_dir: '%kernel.project_dir%/var/uploads/attachments'
    mailer.from_address: '%env(MAILER_FROM_ADDRESS)%'
    mailer.from_name: '%env(MAILER_FROM_NAME)%'
    # Where the OAuth client (claude.ai custom connector) may be sent back after consent.
    app.oauth.redirect_uris:
        - 'https://claude.ai/api/mcp/auth_callback'
        - 'https://claude.com/api/mcp/auth_callback'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Runs before Doctrine's EntityValueResolver (priority 110), which would
    # otherwise try (deprecated) auto-mapping on every Organization argument.
    App\Resolver\OrganizationValueResolver:
        autoconfigure: false
        tags:
            - { name: controller.argument_value_resolver, priority: 150 }

    # One token handler per MCP server, each accepting only its own token scope.
    App\Security\ApiTokenHandler:
        arguments:
            $scope: !php/const App\Entity\ApiToken::SCOPE_TMA

    app.security.notes_api_token_handler:
        class: App\Security\ApiTokenHandler
        arguments:
            $scope: !php/const App\Entity\ApiToken::SCOPE_NOTES

    App\Service\FileUploader:
        arguments:
            $targetDirectory: '%app.attachments_dir%'

    App\Service\EmailService:
        arguments:
            $fromAddress: '%mailer.from_address%'
            $fromName: '%mailer.from_name%'
